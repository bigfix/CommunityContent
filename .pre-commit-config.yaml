# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Install once per clone with `pre-commit install`, then these run
# automatically on `git commit` against whatever's staged. Run manually
# against everything with `pre-commit run --all-files`.
#
# .bes files are excluded from the generic whitespace/EOF hooks below: they
# must be CRLF throughout (see bes-conventions-check's E208), and the
# generic hooks don't know that convention - bes-conventions-check does, and
# owns that formatting for .bes files instead.
#
# Get-ChildItem -Path "Sites/Active Directory Management" -Filter "*.bes" -Recurse | Select-Object -ExpandProperty FullName | ForEach-Object { pre-commit run --files $_ }
#
# Every `rev:` below is a full commit SHA, not a tag: a tag is just a
# mutable ref (its owner can force-move it, or a compromised account could
# retag it to point at malicious content) while a commit SHA is the content
# itself - pre-commit clones and checks out exactly that object, so pinning
# this way is what actually guarantees the version below is what runs, not
# just what USED to be tagged that. The trailing comment names the release
# each SHA corresponds to; re-verify with
# `git ls-remote <repo-url> refs/tags/<tag>` before bumping either.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.bes$
      - id: end-of-file-fixer
        exclude: \.bes$
      - id: check-yaml
      - id: check-added-large-files

  # BigFix-specific content checks - the same hooks this repo's own CI runs
  # via .github/actions/run-pre-commit-autofix (.github/workflows/pre-commit-autofix.yml),
  # so a contributor sees the same feedback locally, before ever pushing.
  # (scripts/pre_commit_bigfix/ is a leftover vendored copy from this repo's
  # sibling project and is not what CI actually runs here - CI invokes these
  # hooks the normal pre-commit way, straight from the pinned repo/rev below.)
  # Unlike CI, these are left at
  # their own default here (no --auto-fix=no): pre-commit always passes the
  # staged files explicitly, and bes-conventions-check /
  # bes-actionscript-validate-prefetch both default --auto-fix to "yes" in
  # exactly that case - the fixable issues get corrected in place and the
  # commit is blocked so you can review and re-stage, which is the normal
  # pre-commit hook experience (the same shape as e.g. a code formatter).
  #
  # bes-schema-validate (BES.xsd validation) is deliberately NOT included:
  # this repo already validates against scripts/BES.xsd directly with
  # xmllint (see .github/actions/validate-bes-xsd), so adding this hook's
  # own validate_bes_xml-based check here would just be a second, possibly
  # inconsistent, schema check.
  - repo: https://github.com/jgstew/pre-commit-bigfix
    rev: ed6788ecbc7fbcc1580c6cd5ae6977e0eadf6bb3 # v1.8.4
    hooks:
      - id: bes-schema-validate

      - id: bes-conventions-check
        # autofix by default, but only report errors;  many missing descriptions on historical content
        args: ["--auto-fix=yes", "--errors-only" ]
        # "--disable=E202,E204,E206,E207,E209,E212,E215,E217,E220,W210,W216"
        #
        # [E200] ActionScript has no MIMEType (temporary)
        # [E202] x-fixlet-modification-time (temporary)
        # [E204] ignore missing descriptions on historical content (temporary)
        # [E206] action-ui-metadata malformed (permanent, missing icon is flagged)
        # [E206] ignore missing 'description' on historical content (temporary)
        # [E207] ActionScript entity-escapes a character (< > &) that requires <![CDATA[ ... ]]> (temporary)
        # [E209] CVENames value invalid (temporary)
        # [E212] relevance is 'true' (temporary)
        # [E215] auto-fixed: stripped whitespace before the ActionScript close
        # [E217] SuccessCriteria Option="CustomRelevance" has an empty relevance body (temporary)
        # [E220] duplicate Analysis <Property> Name
        # [W210] auto-fixed: stripped trailing whitespace
        # [W216] auto-fixed: cleared SourceSeverity "Unspecified" to empty

      - id: bes-actionscript-lint-schclass
        args: ["--auto-fix=yes"]
        # "--disable=E300,E301,E302,W301,W302,W303"
        #
        # [E300] line does not start with a known ActionScript command
        # [E301] {...} substitution has no closing } before the end of the line
        # [E302] createfile until marker (temporary)
        # [W301] warning: unbalanced quotes (temporary)
        # [W302] warning: command verb not lowercase (temporary)
        # [W303] warning: override option not lowercase (temporary)

      - id: bes-actionscript-validate-prefetch
        # ignore missing sha256 on downloads for historical reasons
        args: ["--auto-fix=yes", "--auto-fix-network=no"]
        # "--disable=E400,E401,E403,W403,W406",
        # [E400] invalid prefetch: ERROR: prefetch is invalid, could not be parsed; (temporary)
        # [E401] ignore missing sha256 on downloads for historical reasons (temporary)
        # [E403] invalid prefetch: stray tokens (temporary)
        # [W403] warning: `add nohash prefetch item` (temporary)
        # [W406] warning: prefetch names the file differently than the downloaded file (temporary)

      - id: bes-actionscript-validate-script
        args: ["--disable=E501,E506,E508,E509,E512,E514,E517,E518,E520,E521,E524,E525,W502,W505,W506,W507,W508"]
        # [E500] `if` is never closed by `endif` (temporary)
        # [E501] `endif` with no open `if` (temporary)
        # [E506] second `else` for the same `if` (temporary)
        # [E508] unbalanced { at column 28 -- the relevance substitution has no closing } (temporary)
        # [E509] unbalanced } at (temporary)
        # [E512] duplicate download name  (temporary)
        # [E514] `if` condition is not a relevance expression (temporary)
        # [E517] parameter is referenced without assignment (temporary)
        # [E518] `continue if` condition is not a relevance expression
        # [E520] `setting` line does not match the documented format (temporary)
        # [E521] "regset" key is not a quoted, bracketed (temporary)
        # [E524] auto-fixed: joined `else if` into `elseif`
        # [W502] warning: `action parameter query` after action starts
        # [W504] warning: `dos` is deprecated; (temporary)
        # [W505] warning: cmd.exe is passed a command line but no `/c`
        # [W506] warning: `copy` onto existing files (temporary)
        # [W506] warning: `move` onto existing files (temporary)
        # [W507] warning: reference a file that was not downloaded (temporary)
        # [W508] warning: `parameter ` is never assigned, queried, or named (temporary)
        # [E525] auto-fixed: quoted the folder create path (temporary)

      - id: bes-relevance-lint
        args: ["--disable=E600,E601,E603,E604,E605,W600,W601,W602,W604,E608"]
        # [E600] (parse-error)
        # [E601] unlexable text (error-token))
        # [E603]  (type-error)
        # E604: ignore complexity check (permanent)
        # [E605] (evaluation-cost) (temporary)
        # [W600] unknown inspector (temporary)
        # W601: ignore non-unique-risk (temporary)
        # [W602] warning: (plural-preferred)
        # W604: (version-truncating-compare) (temporary)
        # E608: singular/plural relevance result (site-type-mismatch) (permanent)


  # A local fork https://github.com/mxab/pre-commit-trivy.git
  # to support scanning the filesystem for known vulnerabilities or misplaced secrets
  # removed due to its need for docker on the client, cumbersome for some shared scenarios

  # - repo: https://github.com/Jwalker107/pre-commit-trivy.git
  #   rev: v0.72.0
  #   hooks:
  #     - id: trivyfs-docker
  #       args:
  #         - --skip-dirs
  #         - ./tests
  #         - . # last arg indicates the path/file to scan
  #     - id: trivyconfig-docker
  #       args:
  #         - --skip-dirs
  #         - ./tests
  #         - . # last arg indicates the path/file to scan

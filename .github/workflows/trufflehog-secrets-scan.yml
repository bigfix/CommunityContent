name: TruffleHog Secret Scanning

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  trufflehog:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Required: Fetch all history so TruffleHog can scan all commits
          fetch-depth: 0

      - name: TruffleHog OSS
        # Pinned to the v3.97.1 tag's commit SHA, not the tag itself, so this
        # can't silently pick up new content if the tag were ever moved -
        # same reasoning as this repo's other pinned actions/hooks. v3.97.1
        # is a lightweight tag (`git ls-remote --tags` shows no separate
        # peeled ^{} object), so its SHA already IS the commit, dated
        # 2026-08-24 (that commit's own committer date - a lightweight tag
        # has no separate creation timestamp of its own).
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          # The --only-verified flag ensures the build only fails if the secret is active/live
          extra_args: --only-verified

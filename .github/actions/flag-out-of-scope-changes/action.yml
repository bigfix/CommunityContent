name: Flag changes outside validated content directories
description: >
  Scans the pull request that triggered the calling workflow for any created,
  modified, deleted, or renamed file outside any Sites/*/Fixlets directory or
  the top-level Signatures/ directory (see README.md) - with one narrow
  exception: a modification to scripts/contentid.json that only changes its
  "nextid" integer (see the leniency check below) is treated as in scope,
  since that's exactly what .github/actions/assign-content-ids's own commits
  do. If anything else out of scope is found: submits a REQUEST_CHANGES
  review, applies the needs-manual-review label (creating it first if
  needed), and emits a warning annotation per out-of-scope file.

# This action itself never checks out anything and, with one narrow
# exception, never reads or executes any file CONTENT - only the PR's
# file-list METADATA (path, previous path, status) from the GitHub API. The
# calling workflow does still need a checkout (so `uses: ./...` can resolve
# this action's own files at all) - but it must take no `ref:` override, so
# it resolves to the BASE branch, never the PR's own tree. That's what makes
# it safe for this action to run with a write token even though it's invoked
# from a `pull_request_target` workflow: the code that runs is always the
# already-reviewed version from main, never whatever a malicious PR's own
# commit might have rewritten this action to do.
#
# The one exception: scripts/contentid.json's PR-head content is fetched (via
# a shallow `git fetch` of just the PR head commit, same as every other
# action here that reads a specific trusted-or-not blob by SHA) and compared,
# structurally, against the base checkout's own copy - never executed, never
# even treated as anything but JSON, and size-capped before being parsed at
# all. See contentid_change_ok() below for exactly what "matches the existing
# format" means.
#
# Every value taken from that metadata (a filename, a previous filename) is
# attacker-controlled and is escaped per GitHub's own documented
# `::workflow-command::` escaping rules before being echoed, so a filename
# containing a literal newline, `%`, `:`, or `,` cannot inject a second,
# spoofed annotation or otherwise be misread as workflow-command syntax (see
# escape_property/escape_data below).
#
# This action always exits 0 - see its calling workflow's "Summary" step. Its
# effect is entirely the review + label it leaves behind; a human must
# explicitly dismiss the review (and remove the label) afterward, even once
# a later push removes the out-of-scope change - this action never does
# either automatically.
#
# Requires `pull-requests: write` and `issues: write` on the calling workflow.

outputs:
  flagged:
    description: Number of changed files found outside the validated content directories
    value: ${{ steps.scan.outputs.flagged }}

runs:
  using: composite
  steps:
    - name: List every changed file's path, previous path, and status
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        gh api \
          --paginate \
          "repos/${REPO}/pulls/${PR_NUMBER}/files" \
          --jq '.[] | {filename, previous_filename, status}' \
          > "$RUNNER_TEMP/changed-files.jsonl"

    - name: Fetch scripts/contentid.json as of the PR head (for the leniency check below)
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=1 origin "$HEAD_SHA"
        # Empty/missing (rather than an error) if the PR deleted the file or
        # it never existed at head - contentid_change_ok() below treats that
        # as "does not match", not as "nothing to check".
        git show "$HEAD_SHA:scripts/contentid.json" > "$RUNNER_TEMP/contentid-head.json" 2>/dev/null || true

    - name: Find changes outside the validated content directories
      id: scan
      shell: bash
      run: |
        set -euo pipefail

        # Per GitHub's documented `::workflow-command::` escaping rules
        # (actions/toolkit's core/src/command.ts: escapeProperty/escapeData):
        # order matters - '%' must be escaped first, or the '%' introduced
        # by the other substitutions would itself get re-escaped.
        escape_property() {
          local s=$1
          s=${s//%/%25}; s=${s//$'\r'/%0D}; s=${s//$'\n'/%0A}
          s=${s//:/%3A}; s=${s//,/%2C}
          printf '%s' "$s"
        }
        escape_data() {
          local s=$1
          s=${s//%/%25}; s=${s//$'\r'/%0D}; s=${s//$'\n'/%0A}
          printf '%s' "$s"
        }

        in_scope() {
          # Matches validate-bes-xsd/validate-content-conventions' scope
          # (anything beneath a "Fixlets" subdirectory of any site under
          # Sites/) and validate-signatures-xsd's scope (anything under the
          # top-level Signatures/, at any depth - validate-signatures-xsd
          # itself is what enforces "directly in Signatures/, not nested"; a file
          # that breaks that rule is still "in scope" here and gets a clear
          # FAIL from that action instead of a generic manual-review flag).
          case "$1" in
            Sites/*/Fixlets/*|Signatures/*) return 0 ;;
            *) return 1 ;;
          esac
        }

        CONTENTID_PATH="scripts/contentid.json"
        MAX_CONTENTID_BYTES=4096  # generous - a real {"nextid": N} is well under 100 bytes

        # True only if the PR-head version of scripts/contentid.json is the
        # base-checkout's own copy with nothing changed except a "nextid"
        # integer that did not decrease. Both sides are read as plain files
        # and parsed only as JSON via jq - never executed, never treated as
        # anything else - and size-capped first so a maliciously huge file
        # is rejected (as "does not match") before jq ever looks at it.
        contentid_change_ok() {
          [ -f "$CONTENTID_PATH" ] || return 1
          [ -s "$RUNNER_TEMP/contentid-head.json" ] || return 1

          local base_size head_size
          base_size=$(stat -c%s -- "$CONTENTID_PATH") || return 1
          head_size=$(stat -c%s -- "$RUNNER_TEMP/contentid-head.json") || return 1
          [ "$base_size" -le "$MAX_CONTENTID_BYTES" ] || return 1
          [ "$head_size" -le "$MAX_CONTENTID_BYTES" ] || return 1

          jq -e -n \
            --slurpfile base "$CONTENTID_PATH" \
            --slurpfile head "$RUNNER_TEMP/contentid-head.json" '
            ($base[0] | type) == "object" and ($head[0] | type) == "object" and
            (($base[0] | keys_unsorted | sort) == ($head[0] | keys_unsorted | sort)) and
            (($head[0] | has("nextid")) and (($head[0].nextid | type) == "number") and (($head[0].nextid | floor) == $head[0].nextid)) and
            (($base[0] | with_entries(select(.key != "nextid"))) ==
             ($head[0] | with_entries(select(.key != "nextid")))) and
            ($head[0].nextid >= $base[0].nextid)
          ' >/dev/null 2>&1
        }

        flagged=0
        while IFS= read -r record; do
          filename=$(jq -r '.filename' <<<"$record")
          previous=$(jq -r '.previous_filename // empty' <<<"$record")
          status=$(jq -r '.status' <<<"$record")

          # The one leniency exception - see the top of this file.
          if [ "$filename" = "$CONTENTID_PATH" ] && [ -z "$previous" ] \
             && [ "$status" = "modified" ] && contentid_change_ok; then
            continue
          fi

          out_of_scope=0
          in_scope "$filename" || out_of_scope=1
          if [ -n "$previous" ]; then
            in_scope "$previous" || out_of_scope=1
          fi
          [ "$out_of_scope" -eq 1 ] || continue

          flagged=$((flagged + 1))
          if [ -n "$previous" ]; then
            message="This ${status} file (renamed from \"${previous}\") is outside every Sites/*/Fixlets directory and the top-level Signatures/ directory, so it was not automatically validated and needs manual review."
          else
            message="This ${status} file is outside every Sites/*/Fixlets directory and the top-level Signatures/ directory, so it was not automatically validated and needs manual review."
          fi
          echo "::warning file=$(escape_property "$filename"),line=1,col=1::$(escape_data "$message")"
        done < "$RUNNER_TEMP/changed-files.jsonl"

        echo "flagged=$flagged" >> "$GITHUB_OUTPUT"
        echo "$flagged out-of-scope file(s) found."

    - name: Ensure the needs-manual-review label exists
      if: steps.scan.outputs.flagged != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if ! gh api "repos/${REPO}/labels/needs-manual-review" >/dev/null 2>&1; then
          # GitHub caps a label's description at 100 characters and returns
          # HTTP 422 Validation Failed (with no clearer message than that)
          # if it's longer - keep this under that limit.
          if ! gh api --method POST "repos/${REPO}/labels" \
            -f name="needs-manual-review" \
            -f color="B60205" \
            -f description="Touches files outside the automatically-validated content areas; needs human review." \
            >/dev/null 2>&1; then
            # Another PR's run of this same action may have created the
            # label between our check above and this request - re-check
            # before treating that race as a real failure.
            if ! gh api "repos/${REPO}/labels/needs-manual-review" >/dev/null 2>&1; then
              echo "::error::failed to create the needs-manual-review label" >&2
              exit 1
            fi
          fi
        fi

    - name: Apply the needs-manual-review label
      if: steps.scan.outputs.flagged != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
          -f "labels[]=needs-manual-review" >/dev/null

    - name: Request changes on the pull request
      if: steps.scan.outputs.flagged != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        gh api --method POST "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
          -f event="REQUEST_CHANGES" \
          -f body="Modifications that require further human review" \
          >/dev/null
